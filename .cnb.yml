# Git Sync 流水线：每次 push 到 main 分支后，自动将代码同步到 GitHub
# 使用 tencentcom/git-sync 官方插件，HTTPS + Access Token 认证
main:
  push:
    - name: sync-to-github
      # 敏感信息（GIT_USERNAME / GIT_ACCESS_TOKEN）存放在密钥仓库 secret-env，通过 imports 引用
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        # 凭据预检：imports 导入失败或变量名不一致时在此明确报错，避免 git push 报晦涩的
        # "could not read Username" 错误。若此处 FAIL，请检查 secret-env 密钥仓库
        # env.yml 中是否声明了 GIT_USERNAME / GIT_ACCESS_TOKEN 且值非空。
        - name: verify git credentials
          script: |
            set -e
            if [ -z "${GIT_USERNAME:-}" ]; then
              echo "[FAIL] 环境变量 GIT_USERNAME 为空或未定义（检查 secret-env 密钥仓库 env.yml）"
              exit 1
            fi
            echo "[OK] GIT_USERNAME 已注入 (length=${#GIT_USERNAME})"
            if [ -z "${GIT_ACCESS_TOKEN:-}" ]; then
              echo "[FAIL] 环境变量 GIT_ACCESS_TOKEN 为空或未定义（检查 secret-env 密钥仓库 env.yml）"
              exit 1
            fi
            echo "[OK] GIT_ACCESS_TOKEN 已注入 (length=${#GIT_ACCESS_TOKEN})"
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/RainbowSea.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            branch: main
            force: true

# Issue 自动分配处理人：Issue 创建后自动将处理人设置为仓库维护者
# issue.* 事件需挂靠在 $ 兜底分支下，使用默认分支的配置执行
$:
  issue.open:
    - name: auto-assign-issue-owner
      docker:
        image: python:3.12-slim
      env:
        ISSUE_ASSIGNEE: h1s97x
      stages:
        - name: assign issue to owner
          script: |
            set -e
            python3 - <<'PYEOF'
            import json
            import os
            import urllib.request

            repo = os.environ["CNB_REPO_SLUG"]
            number = os.environ["CNB_ISSUE_IID"]
            owner = os.environ["ISSUE_ASSIGNEE"]
            token = os.environ["CNB_TOKEN"]
            api = os.environ.get("CNB_API_ENDPOINT", "https://api.cnb.cool").rstrip("/")
            base = f"{api}/{repo}/-/issues/{number}/assignees"

            def request(path, method="GET", data=None):
                headers = {
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/json",
                }
                body = None
                if data is not None:
                    body = json.dumps(data).encode()
                    headers["Content-Type"] = "application/json"
                req = urllib.request.Request(path, data=body, method=method, headers=headers)
                with urllib.request.urlopen(req) as resp:
                    return resp.status, resp.read().decode()

            # 1. 查询当前处理人，已分配则跳过
            try:
                _, raw = request(base)
                assignees = json.loads(raw) if raw else []
                names = [a.get("username") for a in assignees] if isinstance(assignees, list) else []
                if owner in names:
                    print(f"[skip] issue already assigned to {owner}")
                    raise SystemExit(0)
            except SystemExit:
                raise
            except Exception as e:
                print(f"[warn] query assignees failed: {e}")

            # 2. 添加处理人
            status, _ = request(base, method="POST", data={"assignees": [owner]})
            print(f"[ok] assigned {owner} to issue #{number}, status={status}")
            PYEOF
