# Git Sync 流水线：每次 push 到 main 分支后，自动将代码同步到 GitHub
# 使用 tencentcom/git-sync 官方插件，HTTPS + Access Token 认证
main:
  push:
    - name: sync-to-github
      # 敏感信息（GIT_USERNAME / GIT_ACCESS_TOKEN）存放在密钥仓库 secret-env，通过 imports 引用
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/RainbowSea.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            branch: main
            force: true
