<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>test nav</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
        integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">


    <style>
        .my-navbar {
            overflow: hidden;
            background-color: #333;
            font-family: Arial;
        }

        .my-navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        .my-navbar a.right {
            float: right;
        }

        .my-navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        .active {
            background-color: #4CAF50;
            color: white;
        }

        .my-navbar .icon {
            display: none;
        }

        @media screen and (max-width: 600px) {
            .my-navbar a:not(:first-child) {
                display: none;
            }

            .my-navbar a.icon {
                float: right;
                display: block;
            }
        }

        @media screen and (max-width: 600px) {
            .my-navbar.responsive {
                position: relative;
            }

            .my-navbar.responsive .icon {
                position: absolute;
                right: 0;
                top: 0;
            }

            .my-navbar.responsive a {
                float: none;
                display: block;
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <div class="my-navbar" id="myNavbar">
        <a href="#" class="active">首页</a>
        <a href="#">照片</a>
        <a href="#">其他</a>
        <a href="#" class="right">登录</a>
        <a href="#" class="right">注册</a>
        <a href="#" class="icon" onclick="myFunction()">
            <i class="fa fa-bars"></i>
        </a>
    </div>

    <script>
        function myFunction() {
            var x = document.getElementById("myNavbar");
            if (x.className === "my-navbar") {
                x.className += " responsive";
            } else {
                x.className = "my-navbar";
            }
        }
    </script>
</body>

</html>
